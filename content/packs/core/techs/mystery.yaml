# Mystery: creed, Dreamwalkers and espionage (attack side, SPY_AND_CONQUEST.md section 5). The spy.* lines drop
# out while espionage is off; whisper_veil keeps its creed x1.2.
- id: dream_lore
  name: {ru: Сонное знание, en: Dream Lore}
  branch: mystery
  tier: 1
  cost: 10
  unlocks: [dreamwalker]
  effects:
    - {effect: income, resource: creed, amount: 1}
- id: whisper_veil
  name: {ru: Завеса шёпота, en: Whisper Veil}
  branch: mystery
  tier: 1
  cost: 10
