id: synclite
name: {ru: Безликий Синклит, en: Faceless Synclite}
description: >-
  Шпионы и интриги. +1 Очко Командования каждый ход, отмена в П2 возвращает больше резерва, ветка «Тайна» дешевле
  на 40%, уникальные Безликие (не замечают укреплений, ходят 2 ребра по любой земле). Минус: плохи с тяжёлым
  оружием — Бронеход, Артиллерия, Мортира и Титан −1 к атаке.
