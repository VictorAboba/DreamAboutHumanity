<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Наблюдение за партией</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1c2026; --muted: #5d6673; --line: #d9dde3; --edge: #9aa3ae;
  --accent: #1f5fbf; --accent-fg: #ffffff; --chip: #eef1f5; --private: #fff6e0; --private-line: #e3b341;
  --public: #eef5ff; --public-line: #6c9be0; --danger: #b42318; --ok: #1a7f37;
  --neutral: #b4bac3; --neutral-line: #8a929d;
  --s0: #2563eb; --s1: #d1342b; --s2: #15803d; --s3: #b45309; --s4: #7e3fc4; --s5: #0e7490; --s6: #c0266d; --s7: #4d7c0f;
  --badge-bg: #ffffff; --badge-fg: #1c2026;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #1a1e24; --fg: #e6e9ed; --muted: #a0a8b3; --line: #2e343c; --edge: #5b6470;
    --accent: #6aa3ff; --accent-fg: #0b1220; --chip: #252b33; --private: #2e2614; --private-line: #b8892a;
    --public: #16233a; --public-line: #4f7fc9; --danger: #ff8a80; --ok: #6fd38a;
    --neutral: #59616c; --neutral-line: #7c8591;
    --s0: #5b9bff; --s1: #ff6b61; --s2: #45c26f; --s3: #f0a43a; --s4: #b98cf5; --s5: #3cc6dc; --s6: #f774b1; --s7: #a6d84a;
    --badge-bg: #0f1216; --badge-fg: #e6e9ed;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
       overflow-x: hidden; }
button, input { font: inherit; color: inherit; }
button { background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--edge); }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 12px 16px 32px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 18px; margin: 0; font-weight: 650; overflow-wrap: anywhere; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; white-space: nowrap; }
.badge { border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; border: 1px solid var(--accent); color: var(--accent); }
.spacer { flex: 1 1 auto; }
.result { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; background: var(--chip); border: 1px solid var(--line); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
.controls input[type=range] { flex: 1 1 180px; min-width: 120px; accent-color: var(--accent); }
.turnlabel { font-weight: 600; min-width: 11em; }
.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.mapbox svg { width: 100%; height: auto; display: block; max-height: 72vh; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid var(--neutral-line); flex: none; }
.details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.details h3 { margin: 0 0 4px; font-size: 16px; }
.details dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; margin: 6px 0; }
.details dt { color: var(--muted); }
.details dd { margin: 0; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tabs button[aria-selected=true] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
ul.feed { list-style: none; padding: 0; margin: 0; }
ul.feed li { padding: 6px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 6px; background: var(--chip); border: 1px solid var(--line); margin-right: 6px; color: var(--muted); }
.tag.battle { color: var(--danger); border-color: var(--danger); }
.tag.captured { color: var(--accent); border-color: var(--accent); }
.msg { border-left: 4px solid var(--public-line); background: var(--public); border-radius: 6px; padding: 6px 10px; margin: 0 0 8px; }
.msg.private { border-left-color: var(--private-line); background: var(--private); }
.msg .head { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.msg .text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
.tablebox { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; font-size: 13px; width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; }
tr.cur td { background: var(--chip); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.card .name { display: flex; gap: 6px; align-items: center; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card svg { width: 100%; height: 36px; display: block; }
h4 { margin: 12px 0 6px; font-size: 14px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.overlay[hidden] { display: none; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; width: 100%; max-width: 420px; }
.dialog h2 { margin: 0 0 8px; font-size: 18px; }
.dialog input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); margin: 8px 0; }
.error { color: var(--danger); min-height: 1.4em; }
.prov { cursor: pointer; }
.prov text { pointer-events: none; }
.note { font-size: 13px; color: var(--muted); margin: 6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Партия</h1>
    <div class="stats">
      <span class="chip" id="scenario">—</span>
      <span class="chip" id="turnchip">Ход —</span>
      <span class="chip" id="phasechip">—</span>
      <span class="chip" id="countdown" hidden>—</span>
      <span class="chip" id="readychip" hidden>—</span>
      <span class="badge" id="level">—</span>
    </div>
    <span class="spacer"></span>
    <button type="button" id="changekey">Сменить ключ</button>
  </header>
  <div class="result" id="result" hidden></div>
  <div class="controls" role="group" aria-label="Повтор">
    <button type="button" id="prev" aria-label="Предыдущий ход">◀</button>
    <button type="button" id="play" aria-label="Проиграть">▶ Повтор</button>
    <button type="button" id="next" aria-label="Следующий ход">▶</button>
    <input type="range" id="slider" min="0" max="0" value="0" aria-label="Ход">
    <span class="turnlabel" id="turnlabel">—</span>
    <button type="button" id="live">Вживую</button>
  </div>
  <div class="grid">
    <section class="panel mapbox" aria-label="Карта">
      <svg id="map" viewBox="-8 -8 116 116" role="img" aria-label="Граф карты"></svg>
      <div class="legend" id="legend"></div>
      <div class="details" id="details"><span class="muted">Нажмите на провинцию, чтобы увидеть подробности.</span></div>
    </section>
    <section class="panel" aria-label="Журнал">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="feed" aria-selected="true">Лента</button>
        <button type="button" role="tab" data-tab="mail" aria-selected="false">Переписка</button>
        <button type="button" role="tab" data-tab="score" aria-selected="false">Счёт</button>
        <button type="button" role="tab" data-tab="techs" aria-selected="false" hidden id="techstab">Технологии</button>
        <button type="button" role="tab" data-tab="timings" aria-selected="false" hidden id="timingstab">Тайминги</button>
      </div>
      <div id="tab-feed" role="tabpanel"></div>
      <div id="tab-mail" role="tabpanel" hidden></div>
      <div id="tab-score" role="tabpanel" hidden></div>
      <div id="tab-techs" role="tabpanel" hidden></div>
      <div id="tab-timings" role="tabpanel" hidden></div>
    </section>
  </div>
</div>
<div class="overlay" id="keydlg" hidden>
  <form class="dialog" id="keyform" autocomplete="off">
    <h2>Ключ наблюдателя</h2>
    <div class="muted">Введите ключ зрителя (печатается при <code>dah game create</code>) или админ-ключ.
      Ключ хранится только в этой вкладке и отправляется заголовком.</div>
    <input type="password" id="keyinput" autocomplete="off" spellcheck="false" aria-label="Ключ" required>
    <div class="error" id="keyerror" role="alert"></div>
    <button type="submit" class="primary">Смотреть</button>
  </form>
</div>
<script>
(function () {
  "use strict";
  var SVGNS = "http://www.w3.org/2000/svg";
  var PHASES = {setup: "Фаза старта", negotiation_1: "Переговоры (П1)", actions: "Действия (Д)", negotiation_2: "Переговоры (П2)",
                resolution: "Расчёт", game_over: "Партия окончена"};
  var PHASE_SHORT = {setup: "старт", negotiation_1: "П1", actions: "Д", negotiation_2: "П2"};
  var ARTIFACT_MODES = {draft: "драфт артефактов", points: "артефакты за очки", none: "без артефактов"};
  var KIND_TAGS = {battle: "бой", edge_battle: "бой", captured: "захват", eliminated: "выбыл", retreat: "отход",
                   retreat_lost: "гибель", destroyed: "уничтожены", recruited: "найм", build_started: "стройка",
                   build_done: "построено", fortify_broken: "укрепление", starvation: "голод",
                   order_rejected: "приказ", economy: "экономика", research_started: "наука",
                   tech_completed: "технология", discovery_found: "находка", discovery_chosen: "находка",
                   discovery_units: "находка", discovery_pending: "находка", guard_cleared: "стража",
                   lair_grew: "логово", order_clipped: "приказ"};
  var FIND_KINDS = {boon: "плюшка", hindrance: "помеха", mixed: "смешанная"};
  var FIND_STATES = {hidden: "не тронута", site: "открыта, ждёт держателя", pending: "ждёт выбора", spent: "сработала"};
  var REASONS = {last_standing: "остался последним", turn_limit: "по лимиту ходов"};
  var parts = location.pathname.split("/").filter(Boolean);
  var gameId = decodeURIComponent(parts[parts.length - 1] || "");
  var api = "/v1/spectate/" + encodeURIComponent(gameId);
  var storeKey = "dah_watch_key:" + gameId;

  var S = {key: null, meta: null, live: null, turn: 0, snap: null, snapText: "", follow: true, playing: null,
           tab: "feed", selected: null, timings: null, timingsAt: 0, pollTimer: null, liveAt: 0};

  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "cls") node.className = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c != null) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return node;
  }
  function sv(tag, attrs) {
    var node = document.createElementNS(SVGNS, tag);
    for (var k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function loadKey() { try { return sessionStorage.getItem(storeKey); } catch (e) { return null; } }
  function saveKey(k) { try { if (k) sessionStorage.setItem(storeKey, k); else sessionStorage.removeItem(storeKey); } catch (e) {} }
  // A link /watch/<id>#key=... carries the key in the fragment, which the browser never sends to a server. The key
  // is taken from it, kept in sessionStorage like a typed one, and the fragment is removed from the address bar at
  // once (history.replaceState), so it is not left visible or in this tab's history entry. The key then goes out
  // only as the Bearer header of the spectator API calls.
  function takeFragmentKey() {
    var hash = location.hash || "";
    if (hash.length < 2) return null;
    var k = null;
    try { k = new URLSearchParams(hash.substring(1)).get("key"); } catch (e) { k = null; }
    if (k === null) return null;
    try { history.replaceState(history.state, "", location.pathname + location.search); }
    // fallback: replace this history entry (assigning location.hash would push a new one and leave the
    // #key=... entry reachable with Back)
    catch (e) { try { location.replace(location.pathname + location.search + "#"); } catch (e2) {} }
    k = k.trim();
    if (!k) return null;
    saveKey(k);
    return k;
  }

  function ApiError(status, code, message) { this.status = status; this.code = code; this.message = message; }
  function get(path) {
    return fetch(api + path, {headers: {"Authorization": "Bearer " + S.key}, cache: "no-store", credentials: "omit"})
      .then(function (r) {
        return r.json().catch(function () { return {ok: false, error: {code: "HTTP_" + r.status, message: "ошибка " + r.status}}; })
          .then(function (data) {
            if (!data.ok) throw new ApiError(r.status, data.error && data.error.code, data.error && data.error.message);
            return data;
          });
      });
  }

  // ---------------------------------------------------------------- seats and names
  function seatIndex(seat) {
    if (!S.meta) return -1;
    for (var i = 0; i < S.meta.seats.length; i++) if (S.meta.seats[i].seat === seat) return i;
    return -1;
  }
  function seatColor(seat) {
    var i = seatIndex(seat);
    return i < 0 ? "var(--neutral)" : "var(--s" + (i % 8) + ")";
  }
  function nick(seat) {
    if (!seat) return "нейтральная";
    var i = seatIndex(seat);
    return i < 0 ? seat : S.meta.seats[i].nick;
  }
  function province(id) {
    var ps = S.meta.map.provinces;
    for (var i = 0; i < ps.length; i++) if (ps[i].id === id) return ps[i];
    return null;
  }
  function snapProvince(id) {
    if (!S.snap) return null;
    for (var i = 0; i < S.snap.provinces.length; i++) if (S.snap.provinces[i].id === id) return S.snap.provinces[i];
    return null;
  }
  function nameOf(table, id) { return (S.snap && S.snap[table] && S.snap[table][id]) || String(id).split(":").pop(); }
  function unitsText(units) {
    var out = [];
    for (var u in units || {}) if (units[u]) out.push(nameOf("unit_names", u) + " ×" + units[u]);
    return out.join(", ") || "нет";
  }
  // stage 5 (ABANDONED_LANDS.md 10): finds of this snapshot's turn that went off (public form for the delayed level)
  function findsHere(id) {
    return (S.snap ? S.snap.events : []).filter(function (e) { return e.kind === "discovery_found" && e.province === id; });
  }
  function layoutOf(id) { return S.snap && S.snap.finds_layout ? S.snap.finds_layout[id] || null : null; }
  function findName(fid) { return nameOf("discovery_names", fid); }
  function fmtSecs(v) { return v == null ? "—" : (v < 100 ? v.toFixed(1) : Math.round(v)) + " с"; }
  function fmtLeft(s) {
    if (s == null) return "—";
    var m = Math.floor(s / 60), r = s % 60;
    return (m > 0 ? m + " мин " : "") + r + " с";
  }

  // ---------------------------------------------------------------- header
  function renderHeader() {
    var m = S.meta, l = S.live;
    $("title").textContent = "Партия " + m.game_id;
    document.title = "Наблюдение: " + m.game_id;
    $("scenario").textContent = m.scenario.name + " · " + m.map.name;
    if (!l) return;
    $("turnchip").textContent = "Ход " + l.turn + "/" + l.turn_limit;
    var phaseText = PHASES[l.phase] || l.phase;
    if (l.setup && l.setup.open) phaseText += " · выбор фракций" + (l.setup.artifacts && l.setup.artifacts !== "none" ? ", " + (ARTIFACT_MODES[l.setup.artifacts] || l.setup.artifacts) : "");
    $("phasechip").textContent = phaseText;
    $("level").textContent = l.level_label;
    var running = !l.game_over;
    $("countdown").hidden = !running || l.seconds_left == null;
    $("readychip").hidden = !running;
    $("readychip").textContent = "готово " + l.ready;
    tickCountdown();
    var res = $("result");
    if (l.game_over && l.result) {
      var winners = (l.result.winners || []).map(nick).join(", ") || "никто";
      res.textContent = "Партия окончена: " + (REASONS[l.result.reason] || l.result.reason || "") + ". Победители: " + winners + ".";
      res.hidden = false;
    } else res.hidden = true;
    $("timingstab").hidden = !l.timings_allowed;
    if (!l.timings_allowed && S.tab === "timings") selectTab("feed");
  }
  function tickCountdown() {
    var l = S.live;
    if (!l || l.game_over || l.seconds_left == null) return;
    var left = Math.max(0, Math.round(l.seconds_left - (Date.now() - S.liveAt) / 1000));
    $("countdown").textContent = "осталось " + fmtLeft(left);
  }

  // ---------------------------------------------------------------- controls
  function maxTurn() { return S.live ? S.live.last_viewable : 0; }
  function renderControls() {
    var max = maxTurn(), sl = $("slider");
    sl.max = String(max);
    sl.value = String(S.turn);
    $("prev").disabled = S.turn <= 0;
    $("next").disabled = S.turn >= max;
    $("live").classList.toggle("on", S.follow);
    $("play").textContent = S.playing ? "❚❚ Пауза" : "▶ Повтор";
    var label;
    if (S.turn === 0) label = "Начало партии";
    else if (S.snap && S.snap.turn === S.turn && S.snap.in_progress) label = "Ход " + S.turn + " — идёт";
    else label = "Ход " + S.turn + " — после расчёта";
    $("turnlabel").textContent = label + " (из " + max + ")";
  }
  // Stepping onto the last viewable turn (▶, the slider or the end of a replay) resumes following new turns;
  // stepping back stops it.
  function goTo(turn, keepFollow) {
    turn = Math.max(0, Math.min(maxTurn(), turn));
    if (!keepFollow) S.follow = turn === maxTurn();
    S.turn = turn;
    renderControls();
    return loadTurn();
  }
  function stopPlay() { if (S.playing) { clearInterval(S.playing); S.playing = null; renderControls(); } }

  // ---------------------------------------------------------------- map
  function renderMap() {
    var svg = $("map"), m = S.meta;
    var active = document.activeElement;
    var focusedId = active && svg.contains(active) && active.getAttribute ? active.getAttribute("data-id") : null;
    clear(svg);
    var edges = sv("g", {});
    m.map.edges.forEach(function (e) {
      var a = province(e[0]), b = province(e[1]);
      edges.appendChild(sv("line", {x1: a.pos[0], y1: a.pos[1], x2: b.pos[0], y2: b.pos[1], stroke: "var(--edge)",
                                    "stroke-width": "0.5", "stroke-linecap": "round"}));
    });
    svg.appendChild(edges);
    m.map.provinces.forEach(function (p) {
      var sp = snapProvince(p.id) || {};
      var owner = sp.owner || null;
      var g = sv("g", {"class": "prov", tabindex: "0", role: "button", "data-id": p.id});
      g.setAttribute("aria-label", p.id + " " + p.name + ", " + nick(owner));
      var x = p.pos[0], y = p.pos[1];
      if (p.capital) g.appendChild(sv("circle", {cx: x, cy: y, r: 6.2, fill: "none", stroke: "var(--fg)", "stroke-width": "0.5",
                                                   "stroke-dasharray": "1.2 0.8"}));
      var selected = S.selected === p.id;
      g.appendChild(sv("circle", {cx: x, cy: y, r: 4.6, fill: owner ? seatColor(owner) : "var(--neutral)",
                                  stroke: selected ? "var(--fg)" : "var(--panel)", "stroke-width": selected ? "1.1" : "0.6"}));
      if (sp.fortified) g.appendChild(sv("circle", {cx: x, cy: y, r: 3.4, fill: "none", stroke: "var(--panel)", "stroke-width": "0.5"}));
      var st = sp.status || {};
      if (st.occupied) g.appendChild(sv("circle", {cx: x, cy: y, r: 5.5, fill: "none", stroke: st.occupied.from ? seatColor(st.occupied.from) : "var(--fg)",
                                                    "stroke-width": "0.9", "stroke-dasharray": "1 0.7"}));
      if (st.ruined_until || st.ravaged_until) g.appendChild(sv("circle", {cx: x, cy: y, r: 4.6, fill: st.ruined_until ? "rgba(0,0,0,.55)" : "rgba(160,90,0,.35)"}));
      // stage 5: Abandoned land (a dotted outer ring), its guard or lair, finds (the layout at the full levels and
      // after the game; a find that went off this turn for every level)
      if (sp.abandoned) g.appendChild(sv("circle", {cx: x, cy: y, r: 7.2, fill: "none", stroke: "var(--muted)", "stroke-width": "0.45",
                                                    "stroke-dasharray": "0.5 0.9"}));
      if (sp.guard) {

    if (v.spent_after_game_usd != null || v.after_game_s != null) {
      out += " (в партии " + (v.spent_in_game_usd == null ? "—" : "$" + v.spent_in_game_usd.toFixed(2)) +
        ", после game_over " + (v.spent_after_game_usd == null ? "—" : "$" + v.spent_after_game_usd.toFixed(2)) +
        (v.after_game_s != null ? " за " + fmtSecs(v.after_game_s) : "") + ")";
    }
    return out;
  }
  function renderTimings() {
    var box = $("tab-timings"), t = S.timings;
    clear(box);
    if (!t) { box.appendChild(el("p", {cls: "muted", text: "Загрузка…"})); return; }
    var seats = S.meta.seats;
    var phases = t.phases.filter(function (p) { return S.turn === 0 || p.turn === S.turn; });
    box.appendChild(el("p", {cls: "note", text: S.turn === 0 ? "Все фазы партии." : "Фазы хода " + S.turn + ". Время от открытия фазы."}));
    phases.forEach(function (ph) {
      box.appendChild(el("h4", {text: "Ход " + ph.turn + " · " + (PHASES[ph.phase] || ph.phase) + " · " +
        (ph.closed === "all_ready" ? "все готовы" : ph.closed === "deadline" ? "по таймеру" : "идёт") +
        (ph.duration_s != null ? ", " + fmtSecs(ph.duration_s) : "")}));
      var tb = el("table");
      tb.appendChild(el("tr", {}, ["Игрок", "до первого вызова", "до подачи", "до ready", "вызовы", "симв. запрос/ответ"].map(function (h) { return el("th", {text: h}); })));
      seats.forEach(function (s) {
        var v = ph.seats[s.seat];
        tb.appendChild(el("tr", {}, [el("td", {text: s.nick})].concat(v ? [fmtSecs(v.first_call_s), fmtSecs(v.first_submit_s), fmtSecs(v.ready_s),
          String(v.calls), v.req_chars + " / " + v.resp_chars] : ["—", "—", "—", "0", "—"]).map(function (x, i) { return i === 0 ? x : el("td", {text: x}); })));
      });
      box.appendChild(el("div", {cls: "tablebox"}, [tb]));
    });
    box.appendChild(el("h4", {text: "Итого за партию"}));
    var tt = el("table");
    tt.appendChild(el("tr", {}, ["Игрок", "вызовы", "симв. запрос/ответ", "служебные (waker)", "симв. служебные", "подачи", "правки", "отклонено", "деньги"].map(function (h) { return el("th", {text: h}); })));
    seats.forEach(function (s) {
      var v = t.totals[s.seat];
      if (!v) return;
      tt.appendChild(el("tr", {}, [s.nick, String(v.calls), v.req_chars + " / " + v.resp_chars, String(v.host_calls),
        v.host_req_chars + " / " + v.host_resp_chars, String(v.submits), String(v.edits),
        String(v.validate_rejected + v.submit_rejected), fmtMoney(v)]
        .map(function (x) { return el("td", {text: x}); })));
    });
    box.appendChild(el("div", {cls: "tablebox"}, [tt]));
  }
  function renderAll() {
    renderHeader(); renderControls(); renderMap(); renderDetails(); renderFeed(); renderMail(); renderScore();
    var hasTechs = !!(S.snap && S.snap.techs_total != null);
    $("techstab").hidden = !hasTechs;
    if (!hasTechs && S.tab === "techs") selectTab("feed");
    renderTechs();
    if (S.tab === "timings") renderTimings();
  }

  // ---------------------------------------------------------------- loading
  function handleError(err) {
    if (err && err.status === 401) { saveKey(null); S.key = null; askKey("Ключ не подошёл к этой партии."); return; }
    console.warn(err);
  }
  function loadTurn() {
    var want = S.turn;
    return get("/turn/" + want).then(function (snap) {
      if (want !== S.turn) return;
      var text = JSON.stringify(snap);
      if (text === S.snapText) return;
      S.snap = snap; S.snapText = text;
      renderAll();
    }).catch(handleError);
  }
  function loadTimings(force) {
    if (!S.live || !S.live.timings_allowed) return;
    if (!force && S.timings && Date.now() - S.timingsAt < 10000) { renderTimings(); return; }
    renderTimings();
    get("/timings").then(function (t) { S.timings = t; S.timingsAt = Date.now(); if (S.tab === "timings") renderTimings(); }).catch(handleError);
  }
  function poll() {
    if (!S.key) return Promise.resolve();
    return get("/live").then(function (l) {
      var prev = S.live;
      S.live = l; S.liveAt = Date.now();
      if (S.follow && !S.playing) S.turn = l.last_viewable;
      if (S.turn > l.last_viewable) S.turn = l.last_viewable;
      renderHeader(); renderControls(); renderScore();
      var changed = !prev || prev.phase_seq !== l.phase_seq || prev.last_viewable !== l.last_viewable;
      var liveTurn = S.snap && S.snap.in_progress && S.snap.turn === S.turn;
      if (!S.snap || S.snap.turn !== S.turn || changed || liveTurn) loadTurn();
      if (S.tab === "timings" && (changed || Date.now() - S.timingsAt > 10000)) loadTimings(true);
      if (l.game_over && S.pollTimer) { clearInterval(S.pollTimer); S.pollTimer = null; }
    }).catch(handleError);
  }
  function start() {
    get("/meta").then(function (m) {
      S.meta = m;
      $("keydlg").hidden = true;
      return poll();
    }).then(function () {
      if (S.key && $("keydlg").hidden && S.live && !S.live.game_over && !S.pollTimer) S.pollTimer = setInterval(poll, 2000);
    }).catch(function (err) {
      if (err && err.status === 401) { saveKey(null); S.key = null; askKey("Ключ не подошёл к этой партии."); }
      else if (err && err.status === 404) askKey("Партия не найдена.");
      else askKey("Не удалось загрузить партию: " + ((err && err.message) || "нет связи с сервером"));
    });
  }
  function askKey(message) {
    if (S.pollTimer) { clearInterval(S.pollTimer); S.pollTimer = null; }
    $("keyerror").textContent = message || "";
    if (!$("keydlg").hidden) { $("keyinput").focus(); return; }  // already open: keep what the user is typing
    $("keydlg").hidden = false;
    $("keyinput").value = "";
    $("keyinput").focus();
  }

  // ---------------------------------------------------------------- events
  $("keyform").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var k = $("keyinput").value.trim();
    if (!k) return;
    S.key = k; saveKey(k);
    $("keyinput").value = "";
    start();
  });
  $("changekey").addEventListener("click", function () { saveKey(null); S.key = null; askKey(""); });
  $("prev").addEventListener("click", function () { stopPlay(); S.follow = false; goTo(S.turn - 1, true); });
  $("next").addEventListener("click", function () { stopPlay(); goTo(S.turn + 1); });
  $("slider").addEventListener("input", function () { stopPlay(); goTo(parseInt(this.value, 10) || 0); });
  $("live").addEventListener("click", function () { stopPlay(); S.follow = true; goTo(maxTurn(), true); });
  $("play").addEventListener("click", function () {
    if (S.playing) { stopPlay(); return; }
    S.follow = false;
    if (S.turn >= maxTurn()) S.turn = 0;
    goTo(S.turn, true);
    S.playing = setInterval(function () {
      if (S.turn >= maxTurn()) { stopPlay(); S.follow = true; renderControls(); return; }
      goTo(S.turn + 1, true);
    }, 1500);
    renderControls();
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"), function (b) {
    b.addEventListener("click", function () { selectTab(b.getAttribute("data-tab")); });
  });
  setInterval(tickCountdown, 1000);

  window.addEventListener("hashchange", function () {
    var k = takeFragmentKey();
    if (!k || k === S.key) return;
    S.key = k;
    $("keyerror").textContent = "";
    start();
  });

  S.key = takeFragmentKey() || loadKey();
  if (S.key) start(); else askKey("");
})();
</script>
</body>
</html>
